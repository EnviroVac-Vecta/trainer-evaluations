name: Publish Evaluations Site

# Rebuilds and publishes the site. Runs on every change, every morning
# (to refresh the employee list), and by hand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '50 11 * * *'   # daily, ~6:50 AM Central (summer) / 5:50 AM (winter)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl requests
      - name: Build site
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

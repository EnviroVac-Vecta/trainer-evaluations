<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EnviroVac Trainer Evaluations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#fff; --sunk:#e8ecf0; --line:#d5dbe2; --fg:#16202b; --muted:#5b6877;
  --accent:#0f5f8a; --accent-ink:#fff; --accent-soft:#dcecf5;
  --good:#2e8b57; --warn:#d9731a; --bad:#c0362c; --needs:#c9541a; --needs-soft:#fbe7dc;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --sunk:#1d2934; --line:#2b3a48; --fg:#e4eaf0; --muted:#9aa8b6;
  --accent:#5cb3e0; --accent-ink:#06202e; --accent-soft:#163448;
  --good:#4fbf83; --warn:#f0954a; --bad:#ef6a5e; --needs:#f0954a; --needs-soft:#3a2617; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --sunk:#1d2934; --line:#2b3a48; --fg:#e4eaf0; --muted:#9aa8b6;
  --accent:#5cb3e0; --accent-ink:#06202e; --accent-soft:#163448;
  --good:#4fbf83; --warn:#f0954a; --bad:#ef6a5e; --needs:#f0954a; --needs-soft:#3a2617; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px clamp(16px,3vw,28px) 120px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1;margin:4px 0 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:17px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 16px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.field label,.flabel{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field .req{color:var(--bad)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
/* type-ahead */
.ta-list{position:absolute;top:100%;left:0;right:0;z-index:30;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:300px;overflow:auto;padding:4px 0}
.ta-opt{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.ta-opt small{display:block;color:var(--muted);font-size:12px}
.ta-opt[aria-selected="true"],.ta-opt:hover{background:var(--accent-soft)}
.ta-none{padding:10px 12px;color:var(--muted);font-size:14px}
/* form choice */
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.formbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:84px}
.formbtn:hover{border-color:var(--accent)}
.formbtn b{font-family:var(--f-display);font-stretch:88%;font-size:17px;line-height:1.15}
.formbtn span{font-size:13px;color:var(--muted)}
.formbtn em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* evaluation */
.evalhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.evalhead h2{font-family:var(--f-display);font-stretch:85%;font-size:24px;margin:0;line-height:1.1}
.evalhead .sub{color:var(--muted);font-size:14px}
.instr{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:var(--radius);padding:10px 12px}
.part{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sec > h3{margin:0;padding:12px 16px;background:var(--sunk);font-family:var(--f-display);font-stretch:88%;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec > h3 .done{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.sec > h3 .done.ok{color:var(--good)}
.unit{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec > h3 + .unit{border-top:0}
.unit h4{margin:0;font-size:16px;font-weight:600}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate .flabel{min-width:88px}
.stars{display:flex;gap:6px}
.stars button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:18px;cursor:pointer}
.stars button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stars.invalid{box-shadow:none}
.stars.invalid button{border-color:var(--bad)}
.scalehint{font-size:12px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px}
.item.lv1{padding-left:28px}
.item.lv2{padding-left:52px}
.item .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:24px}
.item .tx{flex:1;font-size:15px}
.item.hdr .tx{font-weight:600}
.needs{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px;white-space:nowrap}
.needs[aria-pressed="true"]{background:var(--needs-soft);border-color:var(--needs);color:var(--needs)}
.item.flag{background:var(--needs-soft)}
.mini{display:flex;align-items:center;gap:8px;margin-left:auto}
.mini .stars button{width:36px;height:36px;font-size:15px}
.scorebar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.scorebar b{font-family:var(--f-display);font-stretch:85%;font-size:30px}
.scorebar span{color:var(--muted);font-size:14px}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.sig canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);touch-action:none;display:block}
.sig.invalid canvas{border-color:var(--bad)}
.sigrow{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:4px}
.btn{border-radius:var(--radius);padding:12px 18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.6;cursor:wait}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px clamp(16px,3vw,28px) calc(10px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actionbar .msg{flex:1;min-width:160px;font-size:14px;color:var(--muted)}
.actionbar .msg.err{color:var(--bad)}
.notice{border-left:4px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:15px}
.notice.ok{border-left-color:var(--good)}
.notice.err{border-left-color:var(--bad)}
.draftnote{font-size:13px;color:var(--muted)}
/* progress */
.ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.ptable th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
@media (max-width:600px){
  .stars button{width:42px;height:42px}
  .item{flex-wrap:wrap}
  .item .needs{margin-left:34px}
  .item.lv1 .needs,.item.lv2 .needs{margin-left:0}
  .mini{margin-left:34px;width:100%}
}
@media print{.actionbar,.tabs,header.top{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">EnviroVac · Let's Level Up</div>
      <h1>Trainer Evaluations</h1>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="t-eval" aria-selected="true" aria-controls="p-eval">Evaluations</button>
    <button type="button" role="tab" id="t-prog" aria-selected="false" aria-controls="p-prog">Progress</button>
  </nav>

  <!-- ============ EVALUATIONS ============ -->
  <section id="p-eval" role="tabpanel" aria-labelledby="t-eval" style="display:flex;flex-direction:column;gap:16px">
    <div id="result" hidden></div>

    <div class="card" id="who">
      <div class="grid">
        <div class="field" id="fld-trainer"><label for="trainer">Trainer <span class="req">*</span></label><input type="text" id="trainer" autocomplete="off" placeholder="Start typing your name"></div>
        <div class="field" id="fld-employee"><label for="employee">Employee <span class="req">*</span></label><input type="text" id="employee" autocomplete="off" placeholder="Start typing a name"></div>
        <div class="field"><label for="office">Home office</label><input type="text" id="office" autocomplete="off"></div>
        <div class="field"><label for="date">Evaluation date <span class="req">*</span></label><input type="date" id="date"></div>
        <div class="field"><label for="location">Training location</label><input type="text" id="location" autocomplete="off"></div>
      </div>
    </div>

    <div id="choose">
      <div class="flabel" style="margin-bottom:8px">Choose an evaluation</div>
      <div class="forms" id="formlist"></div>
    </div>

    <div id="evaluation" hidden style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- ============ PROGRESS ============ -->
  <section id="p-prog" role="tabpanel" aria-labelledby="t-prog" hidden style="flex-direction:column;gap:14px">
    <div id="progress"></div>
  </section>
</div>

<div class="actionbar" id="actionbar" hidden>
  <div class="in">
    <div class="msg" id="barmsg"></div>
    <button type="button" class="btn" id="b-pdf">Download PDF</button>
    <button type="button" class="btn primary" id="b-send">Save &amp; Send</button>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS_DRAFT = 'tev-draft-v1', LS_TRAINER = 'tev-trainer-v1';
const ROMAN = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx'];
const letter = (lv,i) => lv===0 ? String.fromCharCode(97+(i%26))+(i>=26?String(Math.floor(i/26)):'') : lv===1 ? (ROMAN[i]||String(i+1)) : String(i+1);
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); };
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };

let FORMS = [], CONFIG = {trainers:[], submitUrl:'', minRating:1, maxRating:5}, ROSTER = [], PROGRESS = null;
let FORM = null, MODEL = null;
let S = null; // current answers

/* ---------- model: turn a form definition into rating units ---------- */
function itemText(it){ return typeof it==='string' ? it : it.text; }
function itemSubs(it){ return typeof it==='string' ? [] : (it.subitems||[]); }
function buildModel(form){
  const units = [];
  form.sections.forEach((sec,si)=>{
    const sk = 's'+si;
    const flat = (list, lv, path, out) => list.forEach((it,i)=>{
      const key = path+'.'+i, subs = itemSubs(it);
      out.push({key, lv, letter:letter(lv,i), text:itemText(it), hasSubs:subs.length>0});
      if(subs.length) flat(subs, lv+1, key, out);
    });
    sec._units = [];
    if(sec.kind==='rated-per-item'){
      sec.items.forEach((it,i)=>{
        const items=[]; flat(itemSubs(it),1,sk+'.'+i,items);
        const u = {key:sk+'.'+i, title:itemText(it), letter:letter(0,i), perItem:true, items, comments:false};
        sec._units.push(u); units.push(u);
      });
      sec._commentKey = sk;
    } else if(sec.layout==='row-per-topic'){
      sec.items.forEach((it,i)=>{
        const items=[]; flat(itemSubs(it),0,sk+'.'+i,items);
        const u = {key:sk+'.'+i, title:itemText(it), letter:letter(0,i), items, comments:true, needsSelf:itemSubs(it).length===0};
        sec._units.push(u); units.push(u);
      });
    } else {
      const items=[]; flat(sec.items,0,sk,items);
      const u = {key:sk, title:null, items, comments:true};
      sec._units.push(u); units.push(u);
    }
  });
  return {units};
}

/* ---------- header field mapping ---------- */
function fieldRole(name){
  const n = name.toLowerCase();
  if(/trainer/.test(n)) return 'trainer';
  if(/^(employee|employee name|name|trainee)$/.test(n)) return 'employee';
  if(/office/.test(n)) return 'office';
  if(/date/.test(n) && !/cohort/.test(n)) return 'date';
  if(/location/.test(n)) return 'location';
  return 'extra';
}

/* ---------- state ---------- */
function blankState(formId){ return {formId, ratings:{}, needs:{}, comments:{}, extra:{}, notes:'', sigTrainer:null, sigEmployee:null}; }
function saveDraft(){
  if(!S) return;
  const d = Object.assign({}, S, {trainer:$('trainer').value, employee:$('employee').value, office:$('office').value, date:$('date').value, location:$('location').value, savedAt:Date.now()});
  lsSet(LS_DRAFT, JSON.stringify(d));
  const n=$('draftnote'); if(n) n.textContent='Draft saved on this device '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
let draftTimer=null; const queueSave=()=>{ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,400); };

/* ---------- type-ahead pickers ---------- */
function typeahead(input, getOptions, onPick){
  const box = input.parentElement; let list=null, opts=[], idx=-1;
  const close=()=>{ if(list){ list.remove(); list=null; } idx=-1; };
  const draw=()=>{
    const q = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const all = getOptions();
    opts = (q.length ? all.filter(o=>q.every(t=>(o.label+' '+(o.sub||'')).toLowerCase().includes(t))) : all).slice(0,60);
    if(!all.length){ close(); return; }
    if(!list){ list=document.createElement('div'); list.className='ta-list'; list.setAttribute('role','listbox'); box.appendChild(list); }
    list.innerHTML = opts.length ? opts.map((o,i)=>'<button type="button" role="option" class="ta-opt" data-i="'+i+'" aria-selected="'+(i===idx)+'">'+esc(o.label)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>').join('') : '<div class="ta-none">No match. You can keep what you typed.</div>';
  };
  input.addEventListener('focus', draw);
  input.addEventListener('input', ()=>{ idx=-1; draw(); });
  input.addEventListener('keydown', e=>{
    if(!list) return;
    if(e.key==='ArrowDown'){ idx=Math.min(opts.length-1,idx+1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ idx=Math.max(0,idx-1); draw(); e.preventDefault(); }
    else if(e.key==='Enter' && idx>=0){ pick(opts[idx]); e.preventDefault(); }
    else if(e.key==='Escape'){ close(); }
  });
  const pick=o=>{ input.value=o.label; close(); input.classList.remove('invalid'); onPick && onPick(o); queueSave(); };
  box.addEventListener('mousedown', e=>{ const b=e.target.closest('.ta-opt'); if(b){ e.preventDefault(); pick(opts[+b.dataset.i]); } });
  input.addEventListener('blur', ()=>setTimeout(close,150));
}

/* ---------- render form list ---------- */
function renderFormList(){
  $('formlist').innerHTML = FORMS.map(f=>{
    const n = buildModel(f).units.length;
    return '<button type="button" class="formbtn" data-id="'+esc(f.id)+'"><b>'+esc(f.title)+'</b>'+(f.subtitle?'<span>'+esc(f.subtitle)+'</span>':'')+'<em>'+f.sections.length+' sections · '+n+' rating'+(n===1?'':'s')+'</em></button>';
  }).join('');
}
$('formlist').addEventListener('click', e=>{
  const b=e.target.closest('.formbtn'); if(!b) return;
  const d = JSON.parse(lsGet(LS_DRAFT)||'null');
  $('result').hidden = true;
  openForm(b.dataset.id, d && d.formId===b.dataset.id ? d : null);
});

/* ---------- render evaluation ---------- */
function ratingButtons(key, size){
  const v = S.ratings[key];
  let h = '<div class="stars'+(size?' '+size:'')+'" role="radiogroup" data-rate="'+esc(key)+'">';
  for(let n=CONFIG.minRating;n<=CONFIG.maxRating;n++) h+='<button type="button" role="radio" aria-pressed="'+(v===n)+'" aria-checked="'+(v===n)+'" aria-label="Rating '+n+'" data-v="'+n+'">'+n+'</button>';
  return h+'</div>';
}
function needsBtn(key){ const on=!!S.needs[key]; return '<button type="button" class="needs" aria-pressed="'+on+'" data-needs="'+esc(key)+'">'+(on?'Needs work':'Needs?')+'</button>'; }
function itemRow(it, opts){
  const on = !!S.needs[it.key];
  const hdr = it.hasSubs;
  return '<li class="item lv'+Math.min(it.lv,2)+(on?' flag':'')+(hdr?' hdr':'')+'" data-row="'+esc(it.key)+'"><span class="lt">'+esc(it.letter)+'.</span><span class="tx">'+esc(it.text)+'</span>'+
    (opts && opts.rate ? '<span class="mini">'+ratingButtons(it.key)+'</span>' : '')+needsBtn(it.key)+'</li>';
}
function openForm(id, draft){
  FORM = FORMS.find(f=>f.id===id); if(!FORM) return;
  MODEL = buildModel(FORM);
  S = draft ? Object.assign(blankState(id), draft) : blankState(id);
  if(draft){ ['trainer','employee','office','date','location'].forEach(k=>{ if(draft[k]) $(k).value=draft[k]; }); }
  if(!$('date').value) $('date').value = todayISO();
  const extras = FORM.header_fields.filter(h=>fieldRole(h)==='extra');
  let h = '<div class="card evalhead"><div><h2>'+esc(FORM.title)+'</h2>'+(FORM.subtitle?'<div class="sub">'+esc(FORM.subtitle)+'</div>':'')+'</div><button type="button" class="btn" id="b-change">Choose a different evaluation</button></div>';
  if(extras.length) h += '<div class="card grid">'+extras.map(x=>'<div class="field"><label>'+esc(x)+'</label><input type="'+(/date/i.test(x)?'date':'text')+'" data-extra="'+esc(x)+'" value="'+esc(S.extra[x]||'')+'"></div>').join('')+'</div>';
  h += '<div class="instr">'+esc(FORM.instructions || 'Rate each skill from 1 (low) to 5 (high). Tap "Needs?" on any item that needs more development, then add comments.')+'</div>';
  let lastPart = null;
  FORM.sections.forEach((sec,si)=>{
    if(sec.part && sec.part!==lastPart){ h+='<div class="part">'+esc(sec.part)+'</div>'; lastPart=sec.part; }
    h += '<div class="sec" data-sec="'+si+'"><h3><span>'+esc(sec.title)+'</span><span class="done" id="done-'+si+'"></span></h3>';
    if(sec.kind==='rated-per-item'){
      h += '<div class="unit"><div class="scalehint">Rate each item 1–5.</div><ul class="items">'+
        sec._units.map(u=>itemRow({key:u.key,lv:0,letter:u.letter,text:u.title},{rate:true})+u.items.map(it=>itemRow(it)).join('')).join('')+'</ul>'+
        '<div class="field"><label>Comments</label><textarea data-comment="'+esc(sec._commentKey)+'">'+esc(S.comments[sec._commentKey]||'')+'</textarea></div></div>';
    } else {
      sec._units.forEach(u=>{
        h += '<div class="unit">'+(u.title?'<h4>'+esc(u.letter)+'. '+esc(u.title)+'</h4>':'')+
          '<div class="rate"><span class="flabel">Overall rating</span>'+ratingButtons(u.key)+(u.needsSelf?needsBtn(u.key):'')+'</div>'+
          (u.items.length?'<ul class="items">'+u.items.map(it=>itemRow(it)).join('')+'</ul>':'')+
          '<div class="field"><label>Comments</label><textarea data-comment="'+esc(u.key)+'">'+esc(S.comments[u.key]||'')+'</textarea></div></div>';
      });
    }
    h += '</div>';
  });
  const hasNotes = FORM.signoff_fields.some(f=>/notes/i.test(f));
  if(hasNotes) h += '<div class="card field"><label for="notes">Notes</label><textarea id="notes">'+esc(S.notes||'')+'</textarea></div>';
  h += '<div class="card scorebar" id="score"></div>';
  const empLabel = FORM.signoff_fields.find(f=>/trainee/i.test(f)) ? 'Trainee' : 'Employee';
  h += '<div class="card"><div class="sigs">'+
    sigBox('sigTrainer','Trainer signature')+sigBox('sigEmployee',empLabel+' signature')+'</div></div>';
  h += '<div class="draftnote" id="draftnote"></div>';
  const ev = $('evaluation'); ev.innerHTML = h; ev.hidden=false;
  $('choose').hidden = true; $('actionbar').hidden = false; $('result').hidden = true;
  setupSig('sigTrainer'); setupSig('sigEmployee');
  $('b-change').addEventListener('click', ()=>{ ev.hidden=true; $('choose').hidden=false; $('actionbar').hidden=true; window.scrollTo({top:0}); });
  updateScore(); FORM.sections.forEach((_,si)=>updateDone(si));
  setMsg('');
  window.scrollTo({top:ev.offsetTop-10});
  saveDraft();
}
function sigBox(k,label){ return '<div class="sig" id="box-'+k+'"><div class="sigrow"><span class="flabel">'+esc(label)+' <span class="req" style="color:var(--bad)">*</span></span><button type="button" class="linkbtn" data-clear="'+k+'">Clear</button></div><canvas id="cv-'+k+'" aria-label="'+esc(label)+' pad. Sign with your finger or mouse."></canvas></div>'; }

/* ---------- signatures ---------- */
function setupSig(k){
  const cv=$('cv-'+k), ctx=cv.getContext('2d');
  const fit=()=>{ const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; const keep=S[k]; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; if(keep){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=keep; } };
  fit(); window.addEventListener('resize', ()=>{ if(document.body.contains(cv)) fit(); });
  let drawing=false, last=null, inked=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; inked=true; });
  const end=()=>{ if(!drawing) return; drawing=false; if(inked){ if($('barmsg').classList.contains('err')) setMsg(''); S[k]=cv.toDataURL('image/png'); $('box-'+k).classList.remove('invalid'); queueSave(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
}

/* ---------- interactions ---------- */
$('evaluation').addEventListener('click', e=>{
  if($('barmsg').classList.contains('err')) setMsg('');
  const r = e.target.closest('[data-rate] button');
  if(r){ const g=r.parentElement, k=g.dataset.rate, v=+r.dataset.v;
    S.ratings[k] = S.ratings[k]===v ? undefined : v; if(S.ratings[k]===undefined) delete S.ratings[k];
    g.querySelectorAll('button').forEach(b=>{ const on=+b.dataset.v===S.ratings[k]; b.setAttribute('aria-pressed',on); b.setAttribute('aria-checked',on); });
    g.classList.remove('invalid'); updateScore(); updateDone(+g.closest('.sec').dataset.sec); queueSave(); return; }
  const n = e.target.closest('[data-needs]');
  if(n){ const k=n.dataset.needs; S.needs[k]=!S.needs[k]; if(!S.needs[k]) delete S.needs[k];
    n.setAttribute('aria-pressed',!!S.needs[k]); n.textContent=S.needs[k]?'Needs work':'Needs?';
    const row=n.closest('.item'); if(row) row.classList.toggle('flag',!!S.needs[k]); updateScore(); queueSave(); return; }
  const c = e.target.closest('[data-clear]');
  if(c){ const k=c.dataset.clear, cv=$('cv-'+k); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); S[k]=null; queueSave(); }
});
$('evaluation').addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.comment!==undefined){ S.comments[t.dataset.comment]=t.value; }
  else if(t.dataset.extra!==undefined){ S.extra[t.dataset.extra]=t.value; }
  else if(t.id==='notes'){ S.notes=t.value; }
  queueSave();
});
['trainer','employee','office','date','location'].forEach(k=>$(k).addEventListener('input', ()=>{ $(k).classList.remove('invalid'); queueSave(); }));

function allRatingKeys(){
  const keys=[];
  FORM.sections.forEach(sec=>sec._units.forEach(u=>keys.push(u.key)));
  return keys;
}
function updateDone(si){
  const sec=FORM.sections[si]; const ks=sec._units.map(u=>u.key); const d=ks.filter(k=>S.ratings[k]).length;
  const el=$('done-'+si); if(!el) return; el.textContent=d+'/'+ks.length+' rated'; el.classList.toggle('ok', d===ks.length);
}
function scores(){
  const ks=allRatingKeys(), vals=ks.map(k=>S.ratings[k]).filter(Boolean);
  const total=vals.reduce((a,b)=>a+b,0);
  return {rated:vals.length, count:ks.length, total, max:ks.length*CONFIG.maxRating, avg: vals.length? total/vals.length : 0, needs:Object.keys(S.needs).length};
}
function updateScore(){
  const s=scores();
  $('score').innerHTML = '<div><span>Total score</span><br><b>'+s.total+'</b> <span>of '+s.max+'</span></div>'+
    '<div><span>Average</span><br><b>'+(s.rated? s.avg.toFixed(2):'–')+'</b></div>'+
    '<div><span>Rated</span><br><b>'+s.rated+'</b> <span>of '+s.count+'</span></div>'+
    '<div><span>Items needing work</span><br><b>'+s.needs+'</b></div>';
}

/* ---------- validation ---------- */
function setMsg(t, err){ const m=$('barmsg'); m.textContent=t||''; m.classList.toggle('err',!!err); }
function validate(){
  const problems=[]; let first=null;
  const mark=(el,msg)=>{ el.classList.add('invalid'); problems.push(msg); if(!first) first=el; };
  if(!$('trainer').value.trim()) mark($('trainer'),'trainer');
  if(!$('employee').value.trim()) mark($('employee'),'employee');
  if(!$('date').value) mark($('date'),'date');
  const missing = allRatingKeys().filter(k=>!S.ratings[k]);
  missing.forEach(k=>{ const g=document.querySelector('[data-rate="'+CSS.escape(k)+'"]'); if(g){ g.classList.add('invalid'); if(!first) first=g; } });
  if(missing.length) problems.push(missing.length+' rating'+(missing.length>1?'s':''));
  ['sigTrainer','sigEmployee'].forEach(k=>{ if(!S[k]){ const b=$('box-'+k); b.classList.add('invalid'); problems.push(k==='sigTrainer'?'trainer signature':'employee signature'); if(!first) first=b; } });
  if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); }
  return problems;
}

/* ---------- PDF ---------- */
// The PDF's built-in fonts only cover Western characters; swap the rest.
const pdfText = t => String(t==null?'':t).replace(/\s*→\s*/g,' to ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/[^\x00-\xff–—•…]/g,'');
function buildPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const _text = doc.text.bind(doc); doc.text = (t, ...a) => _text(Array.isArray(t)? t.map(pdfText) : pdfText(t), ...a);
  const _split = doc.splitTextToSize.bind(doc); doc.splitTextToSize = (t, ...a) => _split(pdfText(t), ...a);
  const W = doc.internal.pageSize.getWidth(), M = 40;
  const s = scores();
  const v = k=>$(k).value.trim();
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(FORM.title, M, 50);
  let y = 50;
  if(FORM.subtitle){ doc.setFont('helvetica','normal'); doc.setFontSize(11); y+=16; doc.text(FORM.subtitle, M, y); }
  doc.setFontSize(8); doc.setTextColor(110); doc.text('EnviroVac · Let\'s Level Up · '+(FORM.version||''), W-M, 50, {align:'right'}); doc.setTextColor(0);
  const head = [['Employee', v('employee')],['Home office', v('office')],['Trainer', v('trainer')],['Evaluation date', fmtDate(v('date'))],['Training location', v('location')]];
  Object.keys(S.extra).forEach(k=>{ if(S.extra[k]) head.push([k, /date/i.test(k)?fmtDate(S.extra[k]):S.extra[k]]); });
  doc.autoTable({startY:y+12, body:head.map(r=>r.map(pdfText)), theme:'plain', styles:{fontSize:10,cellPadding:3}, columnStyles:{0:{fontStyle:'bold',cellWidth:110}}, margin:{left:M,right:M}});
  y = doc.lastAutoTable.finalY + 6;
  if(FORM.instructions){ doc.setFontSize(8.5); doc.setTextColor(90); const lines=doc.splitTextToSize(FORM.instructions, W-2*M); doc.text(lines, M, y+10); y+=10+lines.length*10; doc.setTextColor(0); }
  const needsMark = k => S.needs[k] ? 'NEEDS' : '';
  const indent = lv => '    '.repeat(lv);
  FORM.sections.forEach(sec=>{
    const body=[];
    if(sec.kind==='rated-per-item'){
      sec._units.forEach(u=>{
        body.push([{content:u.letter+'. '+u.title, styles:{fontStyle:'normal'}}, String(S.ratings[u.key]||''), needsMark(u.key)]);
        u.items.forEach(it=>body.push([indent(it.lv)+it.letter+'. '+it.text,'',needsMark(it.key)]));
      });
      const c=S.comments[sec._commentKey]; if(c) body.push([{content:'Comments: '+c, colSpan:3, styles:{fontStyle:'italic'}}]);
    } else {
      sec._units.forEach(u=>{
        if(u.title) body.push([{content:u.letter+'. '+u.title, styles:{fontStyle:'bold'}}, String(S.ratings[u.key]||''), u.needsSelf?needsMark(u.key):'']);
        else body.push([{content:'Overall rating', styles:{fontStyle:'bold'}}, String(S.ratings[u.key]||''), '']);
        u.items.forEach(it=>body.push([indent(it.lv+(u.title?1:0))+it.letter+'. '+it.text,'',needsMark(it.key)]));
        const c=S.comments[u.key]; if(c) body.push([{content:'Comments: '+c, colSpan:3, styles:{fontStyle:'italic'}}]);
      });
    }
    doc.autoTable({
      startY:y+8, head:[[ (sec.part? sec.part+' — ':'') + sec.title, 'Rating', 'Needs']], body,
      theme:'grid', margin:{left:M,right:M}, styles:{fontSize:9, cellPadding:4, valign:'top', lineColor:200},
      headStyles:{fillColor:[15,95,138], textColor:255, fontSize:10},
      columnStyles:{1:{cellWidth:48, halign:'center'}, 2:{cellWidth:56, halign:'center', textColor:[192,84,26], fontStyle:'bold'}},
      didParseCell:d=>{ d.cell.text = d.cell.text.map(pdfText); }
    });
    y = doc.lastAutoTable.finalY;
  });
  const sum = [['Total score', s.total+' of '+s.max],['Average score', s.rated? s.avg.toFixed(2):''],['Items needing work', String(s.needs)]];
  if(S.notes) sum.push(['Notes', S.notes]);
  doc.autoTable({startY:y+14, body:sum.map(r=>r.map(pdfText)), theme:'grid', styles:{fontSize:10,cellPadding:5}, columnStyles:{0:{fontStyle:'bold',cellWidth:130}}, margin:{left:M,right:M}});
  y = doc.lastAutoTable.finalY + 20;
  if(y > doc.internal.pageSize.getHeight()-130){ doc.addPage(); y = 50; }
  const sigW = (W-2*M-30)/2, sigH = 70;
  const empLabel = FORM.signoff_fields.find(f=>/trainee/i.test(f)) ? 'Trainee' : 'Employee';
  [['sigTrainer','Trainer: '+v('trainer'), M],['sigEmployee', empLabel+': '+v('employee'), M+sigW+30]].forEach(([k,label,x])=>{
    if(S[k]) doc.addImage(S[k],'PNG',x,y,sigW,sigH);
    doc.setDrawColor(120); doc.line(x,y+sigH+2,x+sigW,y+sigH+2);
    doc.setFontSize(9); doc.text(label, x, y+sigH+14);
  });
  doc.setFontSize(9); doc.text('Date: '+fmtDate(v('date')), M, y+sigH+30);
  const pages = doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text((FORM.footer_title||FORM.title)+' · '+v('employee')+' · page '+i+' of '+pages, W/2, doc.internal.pageSize.getHeight()-20, {align:'center'}); doc.setTextColor(0); }
  return doc;
}
const safe = t => pdfText(t).replace(/[\\/:*?"<>|#%&{}~]+/g,'').replace(/\s+/g,' ').trim();
function fileName(){ return safe(($('date').value||todayISO())+' '+$('employee').value+' - '+FORM.title+' - '+$('trainer').value).slice(0,180)+'.pdf'; }

/* ---------- needs list (for email + log) ---------- */
function needsList(){
  const out=[];
  FORM.sections.forEach(sec=>sec._units.forEach(u=>{
    if(S.needs[u.key]) out.push(sec.title+': '+u.title);
    u.items.forEach(it=>{ if(S.needs[it.key]) out.push(sec.title+(u.title&&!u.perItem?' › '+u.title:'')+(u.perItem?' › '+u.title:'')+': '+it.text); });
  }));
  return out;
}
function sectionScores(){
  return FORM.sections.map(sec=>{ const vals=sec._units.map(u=>S.ratings[u.key]).filter(Boolean); return {section:sec.title, rating: vals.length? +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):null}; });
}

/* ---------- actions ---------- */
$('b-pdf').addEventListener('click', ()=>{
  try{ buildPDF().save(fileName()); }catch(e){ setMsg('Could not make the PDF: '+e.message, true); }
});
$('b-send').addEventListener('click', async ()=>{
  document.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));
  const p = validate();
  if(p.length){ setMsg('Still needed: '+p.join(', ')+'.', true); return; }
  if(!CONFIG.submitUrl){ setMsg('Sending is not set up yet. Use Download PDF for now.', true); return; }
  const btn=$('b-send'); btn.disabled=true; btn.textContent='Sending…'; setMsg('Sending the evaluation…');
  try{
    const doc = buildPDF();
    const pdf = doc.output('datauristring').split(',')[1];
    const s = scores(), needs = needsList();
    const payload = {
      formId: FORM.id, formTitle: FORM.title + (FORM.subtitle? ' – '+FORM.subtitle : ''),
      trainer: $('trainer').value.trim(), employee: $('employee').value.trim(), employeeId: (ROSTER.find(r=>r.name===$('employee').value.trim())||{}).id || '',
      office: $('office').value.trim(), location: $('location').value.trim(), evaluationDate: $('date').value,
      submittedAt: new Date().toISOString(),
      totalScore: s.total, maxScore: s.max, averageScore: +s.avg.toFixed(2), itemsNeedingWork: s.needs,
      needsList: needs.join('; '), sectionScores: sectionScores(), notes: S.notes||'',
      fileName: fileName(), fileContent: pdf
    };
    // Sent as plain text so the browser goes straight to the flow without an extra permission check.
    const res = await fetch(CONFIG.submitUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body: JSON.stringify(payload)});
    if(!res.ok) throw new Error('the server answered '+res.status);
    lsSet(LS_DRAFT, null); lsSet(LS_TRAINER, payload.trainer);
    showResult(true, payload);
  }catch(e){
    setMsg('Not sent: '+e.message+'. Your answers are saved on this device; try again, or use Download PDF.', true);
  }finally{ btn.disabled=false; btn.textContent='Save & Send'; }
});
function showResult(ok, p){
  const r=$('result'); r.hidden=false; r.className='notice ok';
  r.innerHTML = '<b>Sent.</b> '+esc(p.formTitle)+' for '+esc(p.employee)+' was saved to SharePoint and the training team was notified.'+
    ' <button type="button" class="linkbtn" id="b-another">Start another evaluation</button>';
  $('evaluation').hidden=true; $('evaluation').innerHTML=''; $('actionbar').hidden=true; $('choose').hidden=false;
  ['employee','office','location'].forEach(k=>$(k).value=''); $('date').value=todayISO();
  S=null; FORM=null; window.scrollTo({top:0, behavior:'smooth'});
  $('b-another').addEventListener('click', ()=>{ r.hidden=true; $('employee').focus(); });
}

/* ---------- tabs ---------- */
function setTab(t){
  $('p-eval').hidden = t!=='eval'; $('p-prog').hidden = t!=='prog'; $('p-prog').style.display = t==='prog'?'flex':'';
  $('t-eval').setAttribute('aria-selected', t==='eval'); $('t-prog').setAttribute('aria-selected', t==='prog');
  $('actionbar').hidden = !(t==='eval' && FORM && !$('evaluation').hidden);
  if(t==='prog') renderProgress();
}
$('t-eval').addEventListener('click', ()=>setTab('eval'));
$('t-prog').addEventListener('click', ()=>setTab('prog'));

/* ---------- progress (filled in once the data file is connected) ---------- */
function renderProgress(){
  const el=$('progress');
  if(!PROGRESS){ el.innerHTML='<div class="card empty">The progress view will appear here once its data file is connected.</div>'; return; }
  if(window.renderProgressView) window.renderProgressView(el, PROGRESS);
}

/* ---------- boot ---------- */
async function getJSON(u){ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }
(async()=>{
  try{ FORMS = (await getJSON('forms.json')).forms; }catch(e){ $('formlist').innerHTML='<div class="notice err">The evaluation forms could not be loaded. Reload the page.</div>'; return; }
  try{ Object.assign(CONFIG, await getJSON('config.json')); }catch(e){}
  try{ const d = await getJSON('data.json'); ROSTER = d.roster||[]; PROGRESS = d.progress||null; }catch(e){}
  renderFormList();
  typeahead($('trainer'), ()=>(CONFIG.trainers||[]).map(t=>({label:t})), null);
  typeahead($('employee'), ()=>ROSTER.map(r=>({label:r.name, sub:[r.office,r.id].filter(Boolean).join(' · '), r})), o=>{ if(o.r && o.r.office) $('office').value=o.r.office; });
  const t = lsGet(LS_TRAINER); if(t) $('trainer').value=t;
  $('date').value = todayISO();
  const d = JSON.parse(lsGet(LS_DRAFT)||'null');
  if(d && d.formId && FORMS.some(f=>f.id===d.formId)){
    const f = FORMS.find(x=>x.id===d.formId);
    const r=$('result'); r.hidden=false; r.className='notice';
    r.innerHTML='You have an unsent <b>'+esc(f.title)+'</b>'+(d.employee?' for '+esc(d.employee):'')+'. <button type="button" class="linkbtn" id="b-resume">Continue it</button> <button type="button" class="linkbtn" id="b-discard">Discard it</button>';
    $('b-resume').addEventListener('click', ()=>{ r.hidden=true; openForm(d.formId, d); });
    $('b-discard').addEventListener('click', ()=>{ lsSet(LS_DRAFT,null); r.hidden=true; });
  }
})();
})();
</script>
</body>

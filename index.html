<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EnviroVac Trainer Evaluations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7FAFD; --surface:#fff; --sunk:#EEF4FC; --line:#DCE4F0; --fg:#212B3D; --muted:#5B5B63;
  --brand:#33499E; --brand-deep:#242F6E; --orange:#F05020;
  --accent:#33499E; --accent-ink:#fff; --accent-soft:#E4EAF8;
  --good:#2e8b57; --warn:#d9731a; --bad:#c0362c; --needs:#F05020; --needs-soft:#FDEEE8;
  --f-display:"Caladea","Cambria",Georgia,serif;
  --f-body:"Carlito","Calibri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121830; --surface:#1A2244; --sunk:#232D57; --line:#33406E; --fg:#E8ECF8; --muted:#A7AFC8;
  --brand:#2B3C88; --brand-deep:#1A2350; --orange:#F47A54;
  --accent:#8EA2F0; --accent-ink:#121830; --accent-soft:#283463;
  --good:#4fbf83; --warn:#f0954a; --bad:#ef6a5e; --needs:#F47A54; --needs-soft:#3A2418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121830; --surface:#1A2244; --sunk:#232D57; --line:#33406E; --fg:#E8ECF8; --muted:#A7AFC8;
  --brand:#2B3C88; --brand-deep:#1A2350; --orange:#F47A54;
  --accent:#8EA2F0; --accent-ink:#121830; --accent-soft:#283463;
  --good:#4fbf83; --warn:#f0954a; --bad:#ef6a5e; --needs:#F47A54; --needs-soft:#3A2418; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:16px clamp(16px,3vw,28px) 120px;display:flex;flex-direction:column;gap:16px}
header.top,nav.tabs{width:100%;max-width:980px;margin-left:auto;margin-right:auto}
body.wide header.top,body.wide nav.tabs{max-width:none}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;background:var(--brand-deep);color:#fff;border-radius:var(--radius);padding:18px 22px 16px;border-bottom:5px solid var(--orange)}
header.top .eyebrow{color:#C9D3F2}
header.top .lvl{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:8px}
header.top .lvl i{display:inline-block;width:10px;height:10px;background:var(--orange);transform:rotate(45deg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.05;margin:4px 0 0;color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;flex:none}
.tabs button{font-family:var(--f-display);font-weight:700;font-size:18px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 16px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--orange)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.field label,.flabel{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field .req{color:var(--bad)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
.invalid{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
/* type-ahead */
.ta-list{position:absolute;top:100%;left:0;right:0;z-index:30;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:300px;overflow:auto;padding:4px 0}
.ta-opt{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.ta-opt small{display:block;color:var(--muted);font-size:12px}
.ta-opt[aria-selected="true"],.ta-opt:hover{background:var(--accent-soft)}
.ta-none{padding:10px 12px;color:var(--muted);font-size:14px}
/* form choice */
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.formbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:84px}
.formbtn:hover{border-color:var(--accent)}
.formbtn b{font-family:var(--f-display);font-size:18px;color:var(--brand);line-height:1.15}
.formbtn span{font-size:13px;color:var(--muted)}
.formbtn em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
/* evaluation */
.evalhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.evalhead h2{font-family:var(--f-display);font-size:26px;color:var(--brand);margin:0;line-height:1.1}
.evalhead .sub{color:var(--muted);font-size:14px}
.instr{font-size:14px;color:var(--muted);background:var(--sunk);border-left:4px solid var(--orange);border-radius:var(--radius);padding:10px 12px}
.part{font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin:8px 0 -6px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sec > h3{margin:0;padding:12px 16px;background:var(--brand);color:#fff;font-family:var(--f-display);font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec > h3 .done{font-family:var(--f-mono);font-size:12px;font-weight:500;color:#C9D3F2}
.sec > h3 .done.ok{color:#9BE3B9}
.unit{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec > h3 + .unit{border-top:0}
.unit h4{margin:0;font-size:16px;font-weight:600}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate .flabel{min-width:88px}
.stars{display:flex;gap:6px}
.stars button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:18px;cursor:pointer}
.stars button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stars.invalid{box-shadow:none}
.stars.invalid button{border-color:var(--bad)}
.scalehint{font-size:12px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px}
.item.lv1{padding-left:28px}
.item.lv2{padding-left:52px}
.item .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:24px}
.item .tx{flex:1;font-size:15px}
.item.hdr .tx{font-weight:600}
.needs{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px;white-space:nowrap}
.needs[aria-pressed="true"]{background:var(--needs-soft);border-color:var(--needs);color:var(--needs)}
.item.flag{background:var(--needs-soft)}
.mini{display:flex;align-items:center;gap:8px;margin-left:auto}
.mini .stars button{width:36px;height:36px;font-size:15px}
.scorebar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.scorebar b{font-family:var(--f-display);font-size:30px;color:var(--brand)}
.scorebar span{color:var(--muted);font-size:14px}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.sig canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);touch-action:none;display:block}
.sig.invalid canvas{border-color:var(--bad)}
.sigrow{display:flex;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:4px}
.btn{border-radius:var(--radius);padding:12px 18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;min-height:46px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--orange)}
.btn:disabled{opacity:.6;cursor:wait}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px clamp(16px,3vw,28px) calc(10px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actionbar .msg{flex:1;min-width:160px;font-size:14px;color:var(--muted)}
.actionbar .msg.err{color:var(--bad)}
.notice{border-left:4px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:15px}
.notice.ok{border-left-color:var(--good)}
.notice.err{border-left-color:var(--bad)}
.draftnote{font-size:13px;color:var(--muted)}
/* progress */
.ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.ptable th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.evalpanel:not([hidden]){display:flex;flex-direction:column;gap:16px;width:100%;max-width:980px;margin:0 auto}
.cohortpanel{flex-direction:column;gap:12px}
.cohortpanel:not([hidden]){display:flex}
.cfilters{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;align-items:end}
@media (max-width:900px){.cfilters{grid-template-columns:1fr 1fr}}
.msbtn{width:100%;min-height:46px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 34px 10px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;color:var(--fg)}
.msbtn::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.msbtn.on{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--orange);font-weight:600}
.mspop{position:absolute;top:100%;left:0;z-index:40;margin-top:4px;width:max(100%,280px);max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:6px}
.mspop[hidden]{display:none}
.mspop input[type=search]{min-height:38px;padding:7px 10px}
.msacts{display:flex;gap:6px}
.msacts button{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:var(--radius);padding:6px 8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--brand)}
.mslist{max-height:280px;overflow:auto;display:flex;flex-direction:column}
.mslist label{display:flex;gap:8px;align-items:center;padding:7px 6px;border-radius:6px;cursor:pointer;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.mslist label:hover{background:var(--sunk)}
.mslist input{width:18px;height:18px;accent-color:var(--orange);flex:none}
.mslist .sub{margin-left:auto;font-size:12px;color:var(--muted)}
.fbtns{display:flex;gap:8px;align-self:end}.fbtns .btn{flex:1;padding:12px 10px;white-space:nowrap}
.cbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ctable{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.ctable th{position:sticky;top:0;z-index:2;background:var(--brand-deep);text-align:left;font-size:11px;font-weight:700;letter-spacing:.03em;color:#E4EAF8;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.ctable th button{all:unset;cursor:pointer}
.ctable th.tc{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:118px;padding:8px 4px;max-width:34px}
.ctable td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--surface)}
.ctable td.sticky,.ctable th.sticky{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line);min-width:210px}
.ctable td:nth-child(2){min-width:150px}
.ctable td:nth-child(3){min-width:120px}
.ctable th.sticky{z-index:3}
.ctable tr.nr td{background:color-mix(in srgb,#e5484d 13%,var(--surface))}
.ctable tr.gone td{color:var(--muted)}
.ctable tr.det td{background:var(--sunk)}
.who2{all:unset;cursor:pointer;font-weight:700;color:var(--brand);border-bottom:1px dotted var(--brand)}
.meta{display:block;font-size:11.5px;color:var(--muted)}
.tag2{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:0 5px;margin:2px 4px 0 0;border:1px solid var(--line);color:var(--muted)}
.tag2.nr{border-color:#e5484d;color:#c0362c}
.prog{display:flex;align-items:center;gap:6px;min-width:110px}
.prog .b{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--good)}
.prog b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.st{display:inline-block;min-width:26px;text-align:center;border-radius:4px;padding:2px 4px;font-family:var(--f-mono);font-size:10.5px;white-space:nowrap}
.st.c{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--fg)}
.st.s{background:var(--brand);color:#fff}
.st.d{background:color-mix(in srgb,var(--bad) 22%,var(--surface));color:var(--fg)}
.st.i{box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
.st.u{color:var(--muted)}
.st.n{color:var(--line)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:6px 2px}
.detail h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.detail ul{margin:0;padding-left:18px;font-size:13px}
.cmts,.evneeds{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.evneeds .ev{margin:0 0 8px;font-size:13px;max-width:900px}
.evneeds .ev b{font-size:13px}
.evneeds .ev ul{margin:4px 0 0;padding-left:18px}
.evneeds .ev .nsec{font-weight:600;margin-top:4px}
#cmt-recent li{cursor:pointer}
.cmts ol{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;max-width:900px}
.cmts li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.cmts li .meta{display:block;margin-bottom:2px}
.cmts .addc{display:grid;grid-template-columns:220px 1fr auto;gap:8px;align-items:start;max-width:900px}
.cmts .addc input,.cmts .addc textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.cmts .addc textarea{min-height:38px;resize:vertical}
@media (max-width:700px){.cmts .addc{grid-template-columns:1fr}}
.cpicks{display:flex;flex-wrap:wrap;gap:8px}
.cpick{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--brand);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:42px}
.cpick:hover{border-color:var(--brand)}
.cpick[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:inset 0 -3px 0 var(--orange)}
.ritem{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec > h3 + .ritem{border-top:0}
.ritem.flag{background:var(--needs-soft)}
.rhead{display:flex;gap:10px;align-items:baseline}
.rhead .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:22px}
.rhead .tx{font-weight:700;font-size:16px}
.talk{list-style:none;margin:-2px 0 0 32px;padding:0;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.iitem{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(170px,1.4fr) 170px 165px 150px minmax(150px,1.6fr);gap:10px 14px;align-items:center}
.sec > h3 + .iitem{border-top:0}
.iitem.got{background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.iitem .tx{font-weight:600}
.ichk{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px}
.ichk input{width:22px;height:22px;accent-color:var(--orange);flex:none}
.iitem input[type=date],.iitem input[type=text]{min-height:40px;padding:7px 10px}
.ihead{display:grid;grid-template-columns:minmax(170px,1.4fr) 170px 165px 150px minmax(150px,1.6fr);gap:14px;padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
@media (max-width:760px){.iitem{grid-template-columns:1fr 1fr}.iitem .tx{grid-column:1/-1}.iitem .note{grid-column:1/-1}.ihead{display:none}}
.talk .t2{margin-left:22px}.talk .t3{margin-left:44px}
.talk .lt{font-family:var(--f-mono);font-size:11px}
.rrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:32px}
.lvltag{font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;background:var(--sunk);color:var(--muted)}
.lvltag.lv-need{background:var(--orange);color:#fff}
.lvltag.lv-ok{background:var(--accent-soft);color:var(--brand)}
.lvltag.lv-top{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good)}
@media (max-width:600px){
  .rrow,.talk{margin-left:0}
  .actionbar .msg{flex-basis:100%;order:-1}
  .actionbar .btn{flex:1}
  .stars button{width:42px;height:42px}
  .item{flex-wrap:wrap}
  .item .needs{margin-left:34px}
  .item.lv1 .needs,.item.lv2 .needs{margin-left:0}
  .mini{margin-left:34px;width:100%}
}
@media print{.actionbar,.tabs,header.top{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">EnviroVac University</div>
      <h1>Trainer Evaluations</h1>
    </div>
    <div class="lvl"><i></i>Let's Level Up</div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="t-eval" aria-selected="true" aria-controls="p-eval">Evaluations</button>
    <button type="button" role="tab" id="t-cur" aria-selected="false" aria-controls="p-cur">Current Training Cycles</button>
    <button type="button" role="tab" id="t-past" aria-selected="false" aria-controls="p-past">Past Training Cycles</button>
    <button type="button" role="tab" id="t-all" aria-selected="false" aria-controls="p-all">All Training Cycles</button>
    <button type="button" role="tab" id="t-cmt" aria-selected="false" aria-controls="p-cmt">Comments</button>
  </nav>

  <!-- ============ EVALUATIONS ============ -->
  <section id="p-eval" role="tabpanel" aria-labelledby="t-eval" class="evalpanel">
    <div id="result" hidden></div>

    <div class="card" id="who">
      <div class="grid">

        <div class="field" id="fld-employee"><label for="employee">Employee <span class="req">*</span></label><input type="text" id="employee" autocomplete="off" placeholder="Start typing a name"></div>
        <div class="field"><label for="office">Home office</label><input type="text" id="office" autocomplete="off"></div>
        <div class="field"><label for="date">Evaluation date <span class="req">*</span></label><input type="date" id="date"></div>

      </div>
    </div>

    <div id="choose">
      <div class="flabel" style="margin-bottom:8px">Training Cycle</div>
      <div class="cpicks" id="cohortpick" role="tablist" aria-label="Training Cycle"></div>

  <!-- ============ COHORTS ============ -->
  <section id="p-cur" role="tabpanel" aria-labelledby="t-cur" hidden class="cohortpanel"></section>
  <section id="p-past" role="tabpanel" aria-labelledby="t-past" hidden class="cohortpanel"></section>
  <section id="p-all" role="tabpanel" aria-labelledby="t-all" hidden class="cohortpanel"></section>
  <section id="p-cmt" role="tabpanel" aria-labelledby="t-cmt" hidden class="cohortpanel">
    <div class="card">
      <div class="field" style="max-width:520px"><label for="cmt-pick">Employee (Level Up program)</label>
        <input type="search" id="cmt-pick" list="cmt-people" placeholder="Start typing a name" autocomplete="off"><datalist id="cmt-people"></datalist></div>
    </div>
    <div id="cmt-person"></div>

</div>

<div class="actionbar" id="actionbar" hidden>
  <div class="in">
    <div class="msg" id="barmsg"></div>
    <button type="button" class="btn" id="b-pdf">Download PDF</button>
    <button type="button" class="btn primary" id="b-send">Save &amp; Send</button>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS_DRAFT = 'tev-draft-v2', LS_TRAINER = 'tev-trainer-v1';
const ROMAN = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx'];
const letter = (lv,i) => lv===0 ? String.fromCharCode(97+(i%26))+(i>=26?String(Math.floor(i/26)):'') : lv===1 ? (ROMAN[i]||String(i+1)) : String(i+1);
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); };
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };

let FORMS = [], CONFIG = {trainers:[], submitUrl:'', logUrl:'', commentSaveUrl:'', commentReadUrl:'', minRating:1, maxRating:5}, ROSTER = [];
let FORM = null, MODEL = null;
let S = null; // current answers

/* ---------- model: turn a form definition into rating units ---------- */
const nice = t => String(t||'').replace(/\s*→\s*/g,' to ');
function itemText(it){ return typeof it==='string' ? it : it.text; }
function itemSubs(it){ return typeof it==='string' ? [] : (it.subitems||[]); }
function buildModel(form){
  // Every main item gets its own 1-5 rating; bullets under it are talking points.
  const units = [];
  form.sections.forEach((sec,si)=>{
    const sk = 's'+si;
    const talk = (list, lv, out) => list.forEach((it,k)=>{ out.push({lv, letter:letter(lv,k), text:itemText(it)}); talk(itemSubs(it), lv+1, out); });
    sec._units = sec.items.map((it,i)=>{
      const subs=[]; talk(itemSubs(it), 1, subs);
      const u = {key:sk+'.'+i, letter:letter(0,i), title:itemText(it), subs};
      units.push(u); return u;
    });
    sec._commentKey = sk;
  });
  return {units};
}
const LEVELS = {1:'Needs Work',2:'Needs Work',3:'Meets Standard',4:'Proficient',5:'Mastered'};
const levelClass = v => !v ? '' : v<=2 ? 'lv-need' : v===5 ? 'lv-top' : 'lv-ok';
const RATE_HELP = 'Rate each item 1–5:  1–2 Needs Work · 3 Meets Standard · 4 Proficient · 5 Mastered. Bullets under an item are talking points.';
// Which evaluations belong to each cohort.
const COHORT_FORMS = [
  ['Intake (all levels)', ['intake']],
  ['Tech I to Tech II', ['tech-i-to-tech-ii']],
  ['Tech II to Tech III', ['tech-ii-to-tech-iii','hazwoper-decontamination']],
  ['Tech III to Jr. Operator', ['operator-training','driver-part-1-pickup-trailer','driver-part-2-vacuum-truck']],
  ['Jr. Operator to Sr. Operator', ['basic-mechanical-troubleshooting','basic-setup-troubleshooting']],
  ['Sr. Operator to Crew Leader', ['hydroblasting-tube-bundle-automation','pump-advance-mechanical']],
];
const LS_COHORT = 'tev-cohort-v1';
let PICKED_COHORT = lsGet(LS_COHORT) || COHORT_FORMS[0][0];

/* ---------- header field mapping ---------- */
function fieldRole(name){
  const n = name.toLowerCase();
  if(/trainer/.test(n)) return 'trainer';
  if(/^(employee|employee name|name|trainee)$/.test(n)) return 'employee';
  if(/office/.test(n)) return 'office';
  if(/date/.test(n) && !/cohort|training cycle/.test(n)) return 'date';
  if(/location/.test(n)) return 'location';
  return 'extra';
}

/* ---------- state ---------- */
function blankState(formId){ return {formId, ratings:{}, comments:{}, extra:{}, intake:{}, notes:'', sigTrainer:null, sigEmployee:null}; }
const isIntake = f => !!f && f.type==='intake';
const INTAKE_HELP = 'For each training, check Previously Completed and/or Previously Observed, add the date it was observed, and any note.';
function intakeRow(u){
  const v=S.intake[u.key]||{}, k=esc(u.key);
  return '<div class="iitem'+(v.done||v.obs?' got':'')+'" data-irow="'+k+'"><span class="tx">'+esc(u.title)+'</span>'+
    '<label class="ichk"><input type="checkbox" data-ik="'+k+'" data-f="done"'+(v.done?' checked':'')+'> Previously completed</label>'+
    '<label class="ichk"><input type="checkbox" data-ik="'+k+'" data-f="obs"'+(v.obs?' checked':'')+'> Previously observed</label>'+
    '<input type="date" data-ik="'+k+'" data-f="date" value="'+esc(v.date||'')+'" aria-label="'+esc(u.title)+' observed date">'+
    '<input type="text" class="note" data-ik="'+k+'" data-f="note" value="'+esc(v.note||'')+'" placeholder="Note / comment" aria-label="'+esc(u.title)+' note"></div>';
}
function saveDraft(){
  if(!S) return;
  const d = Object.assign({}, S, {trainer:$('trainer').value, employee:$('employee').value, office:$('office').value, date:$('date').value, location:$('location').value, savedAt:Date.now()});
  lsSet(LS_DRAFT, JSON.stringify(d));
  const n=$('draftnote'); if(n) n.textContent='Draft saved on this device '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
let draftTimer=null; const queueSave=()=>{ clearTimeout(draftTimer); draftTimer=setTimeout(saveDraft,400); };

/* ---------- type-ahead pickers ---------- */
function typeahead(input, getOptions, onPick){
  const box = input.parentElement; let list=null, opts=[], idx=-1;
  const close=()=>{ if(list){ list.remove(); list=null; } idx=-1; };
  const draw=()=>{
    const q = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const all = getOptions();
    opts = (q.length ? all.filter(o=>q.every(t=>(o.label+' '+(o.sub||'')).toLowerCase().includes(t))) : all).slice(0,60);
    if(!all.length){ close(); return; }
    if(!list){ list=document.createElement('div'); list.className='ta-list'; list.setAttribute('role','listbox'); box.appendChild(list); }
    list.innerHTML = opts.length ? opts.map((o,i)=>'<button type="button" role="option" class="ta-opt" data-i="'+i+'" aria-selected="'+(i===idx)+'">'+esc(o.label)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>').join('') : '<div class="ta-none">'+(input.id==='trainer'?'Not on the list. Keep typing your full name (substitute trainer).':'No match. You can keep what you typed.')+'</div>';
  };
  input.addEventListener('focus', draw);
  input.addEventListener('input', ()=>{ idx=-1; draw(); });
  input.addEventListener('keydown', e=>{
    if(!list) return;
    if(e.key==='ArrowDown'){ idx=Math.min(opts.length-1,idx+1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ idx=Math.max(0,idx-1); draw(); e.preventDefault(); }
    else if(e.key==='Enter' && idx>=0){ pick(opts[idx]); e.preventDefault(); }
    else if(e.key==='Escape'){ close(); }
  });
  const pick=o=>{ input.value=o.label; close(); input.classList.remove('invalid'); onPick && onPick(o); queueSave(); };
  box.addEventListener('mousedown', e=>{ const b=e.target.closest('.ta-opt'); if(b){ e.preventDefault(); pick(opts[+b.dataset.i]); } });
  input.addEventListener('blur', ()=>setTimeout(close,150));
}

/* ---------- render form list ---------- */
function renderFormList(){
  if(!COHORT_FORMS.some(c=>c[0]===PICKED_COHORT)) PICKED_COHORT = COHORT_FORMS[0][0];
  $('cohortpick').innerHTML = COHORT_FORMS.map(([c])=>'<button type="button" role="tab" class="cpick" data-cohort="'+esc(c)+'" aria-selected="'+(c===PICKED_COHORT)+'">'+esc(c)+'</button>').join('');
  const ids = (COHORT_FORMS.find(c=>c[0]===PICKED_COHORT)||[,[]])[1];
  $('formlist').innerHTML = ids.map(id=>FORMS.find(f=>f.id===id)).filter(Boolean).map(f=>{
    const n = buildModel(f).units.length;
    return '<button type="button" class="formbtn" data-id="'+esc(f.id)+'"><b>'+esc(nice(f.title))+'</b>'+(f.subtitle?'<span>'+esc(f.subtitle)+'</span>':'')+'<em>'+f.sections.length+(isIntake(f)?' levels · '+n+' trainings to check':' sections · '+n+' items to rate')+'</em></button>';
  }).join('');
}
function pickCohort(c){ PICKED_COHORT = c; lsSet(LS_COHORT, c); renderFormList(); }
$('formlist').addEventListener('click', e=>{
  const b=e.target.closest('.formbtn'); if(!b) return;
  const d = JSON.parse(lsGet(LS_DRAFT)||'null');
  $('result').hidden = true;
  openForm(b.dataset.id, d && d.formId===b.dataset.id ? d : null);
});

/* ---------- render evaluation ---------- */
function ratingButtons(key, size){
  const v = S.ratings[key];
  let h = '<div class="stars'+(size?' '+size:'')+'" role="radiogroup" data-rate="'+esc(key)+'">';
  for(let n=CONFIG.minRating;n<=CONFIG.maxRating;n++) h+='<button type="button" role="radio" aria-pressed="'+(v===n)+'" aria-checked="'+(v===n)+'" aria-label="Rating '+n+'" data-v="'+n+'">'+n+'</button>';
  return h+'</div>';
}
function levelTag(key){ const v=S.ratings[key]; return '<span class="lvltag '+levelClass(v)+'" id="lvl-'+esc(key)+'">'+(v?LEVELS[v]:'Not rated')+'</span>'; }
function itemBlock(u){
  const v=S.ratings[u.key];
  return '<div class="ritem'+(v&&v<=2?' flag':'')+'" data-item="'+esc(u.key)+'"><div class="rhead"><span class="lt">'+esc(u.letter)+'.</span><span class="tx">'+esc(u.title)+'</span></div>'+
    (u.subs.length?'<ul class="talk">'+u.subs.map(t=>'<li class="t'+Math.min(t.lv,3)+'"><span class="lt">'+esc(t.letter)+'.</span> '+esc(t.text)+'</li>').join('')+'</ul>':'')+
    '<div class="rrow">'+ratingButtons(u.key)+levelTag(u.key)+'</div></div>';
}
function openForm(id, draft){
  FORM = FORMS.find(f=>f.id===id); if(!FORM) return;
  MODEL = buildModel(FORM);
  S = draft ? Object.assign(blankState(id), draft) : blankState(id);
  if(draft){ ['trainer','employee','office','date','location'].forEach(k=>{ if(draft[k]) $(k).value=draft[k]; }); }
  if(!$('date').value) $('date').value = todayISO();
  const extras = FORM.header_fields.filter(h=>fieldRole(h)==='extra');
  let h = '<div class="card evalhead"><div><h2>'+esc(nice(FORM.title))+'</h2>'+(FORM.subtitle?'<div class="sub">'+esc(FORM.subtitle)+'</div>':'')+'</div><button type="button" class="btn" id="b-change">Choose a different evaluation</button></div>';
  if(extras.length) h += '<div class="card grid">'+extras.map(x=>'<div class="field"><label>'+esc(x)+(isIntake(FORM)&&/level/i.test(x)?' <span class="req">*</span>':'')+'</label>'+
    (FORM.levels && /level/i.test(x)
      ? '<select data-extra="'+esc(x)+'"><option value="">Pick a level</option>'+FORM.levels.map(l=>'<option'+(S.extra[x]===l?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
      : '<input type="'+(/date/i.test(x)?'date':'text')+'" data-extra="'+esc(x)+'" value="'+esc(S.extra[x]||'')+'">')+'</div>').join('')+'</div>';
  h += '<div class="instr">'+esc(isIntake(FORM)? INTAKE_HELP : RATE_HELP)+'</div>';
  let lastPart = null;
  if(isIntake(FORM)) FORM.sections.forEach((sec,si)=>{
    h += '<div class="sec" data-sec="'+si+'"><h3><span>'+esc(sec.title)+'</span><span class="done" id="done-'+si+'"></span></h3>'+
      '<div class="ihead"><span>Training</span><span>Completed</span><span>Observed</span><span>Observed date</span><span>Note / comment</span></div>'+
      sec._units.map(intakeRow).join('')+'</div>';
  });
  else FORM.sections.forEach((sec,si)=>{
    if(sec.part && sec.part!==lastPart){ h+='<div class="part">'+esc(sec.part)+'</div>'; lastPart=sec.part; }
    h += '<div class="sec" data-sec="'+si+'"><h3><span>'+esc(sec.title)+'</span><span class="done" id="done-'+si+'"></span></h3>'+
      sec._units.map(itemBlock).join('')+
      '<div class="unit"><div class="field"><label>Comments</label><textarea data-comment="'+esc(sec._commentKey)+'">'+esc(S.comments[sec._commentKey]||'')+'</textarea></div></div></div>';
  });
  const hasNotes = isIntake(FORM) || FORM.signoff_fields.some(f=>/notes/i.test(f));
  if(hasNotes) h += '<div class="card field"><label for="notes">Notes</label><textarea id="notes">'+esc(S.notes||'')+'</textarea></div>';
  h += '<div class="card scorebar" id="score"></div>';
  const empLabel = FORM.signoff_fields.find(f=>/trainee/i.test(f)) ? 'Trainee' : 'Employee';
  h += '<div class="card"><div class="sigs">'+
    sigBox('sigTrainer','Trainer signature')+sigBox('sigEmployee',empLabel+' signature')+'</div></div>';
  h += '<div class="draftnote" id="draftnote"></div>';
  const ev = $('evaluation'); ev.innerHTML = h; ev.hidden=false;
  $('choose').hidden = true; $('actionbar').hidden = false; $('result').hidden = true;
  setupSig('sigTrainer'); setupSig('sigEmployee');
  $('b-change').addEventListener('click', ()=>{ ev.hidden=true; $('choose').hidden=false; $('actionbar').hidden=true; window.scrollTo({top:0}); });
  updateScore(); FORM.sections.forEach((_,si)=>updateDone(si));
  setMsg('');
  window.scrollTo({top:ev.offsetTop-10});
  saveDraft();
}
function sigBox(k,label){ return '<div class="sig" id="box-'+k+'"><div class="sigrow"><span class="flabel">'+esc(label)+' <span class="req" style="color:var(--bad)">*</span></span><button type="button" class="linkbtn" data-clear="'+k+'">Clear</button></div><canvas id="cv-'+k+'" aria-label="'+esc(label)+' pad. Sign with your finger or mouse."></canvas></div>'; }

/* ---------- signatures ---------- */
function setupSig(k){
  const cv=$('cv-'+k), ctx=cv.getContext('2d');
  const fit=()=>{ const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; const keep=S[k]; cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; if(keep){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=keep; } };
  fit(); window.addEventListener('resize', ()=>{ if(document.body.contains(cv)) fit(); });
  let drawing=false, last=null, inked=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; inked=true; });
  const end=()=>{ if(!drawing) return; drawing=false; if(inked){ if($('barmsg').classList.contains('err')) setMsg(''); S[k]=cv.toDataURL('image/png'); $('box-'+k).classList.remove('invalid'); queueSave(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
}

/* ---------- interactions ---------- */
$('evaluation').addEventListener('click', e=>{
  if($('barmsg').classList.contains('err')) setMsg('');
  const r = e.target.closest('[data-rate] button');
  if(r){ const g=r.parentElement, k=g.dataset.rate, v=+r.dataset.v;
    S.ratings[k] = S.ratings[k]===v ? undefined : v; if(S.ratings[k]===undefined) delete S.ratings[k];
    g.querySelectorAll('button').forEach(b=>{ const on=+b.dataset.v===S.ratings[k]; b.setAttribute('aria-pressed',on); b.setAttribute('aria-checked',on); });
    const t=$('lvl-'+k), nv=S.ratings[k]; if(t){ t.className='lvltag '+levelClass(nv); t.textContent=nv?LEVELS[nv]:'Not rated'; }
    const box=g.closest('.ritem'); if(box) box.classList.toggle('flag', !!nv && nv<=2);
    g.classList.remove('invalid'); updateScore(); updateDone(+g.closest('.sec').dataset.sec); queueSave(); return; }
  const c = e.target.closest('[data-clear]');
  if(c){ const k=c.dataset.clear, cv=$('cv-'+k); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); S[k]=null; queueSave(); }
});
$('evaluation').addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.ik!==undefined){
    const k=t.dataset.ik, o=S.intake[k]||(S.intake[k]={});
    o[t.dataset.f] = t.type==='checkbox' ? t.checked : t.value;
    const row=t.closest('.iitem'); if(row) row.classList.toggle('got', !!(o.done||o.obs));
    updateDone(+t.closest('.sec').dataset.sec); updateScore();
  }
  else if(t.dataset.comment!==undefined){ S.comments[t.dataset.comment]=t.value; }
  else if(t.dataset.extra!==undefined){ S.extra[t.dataset.extra]=t.value; t.classList.remove('invalid'); }
  else if(t.id==='notes'){ S.notes=t.value; }
  queueSave();
});
['trainer','employee','office','date','location'].forEach(k=>$(k).addEventListener('input', ()=>{ $(k).classList.remove('invalid'); queueSave(); }));

const intakeGot = k => { const o=S.intake[k]||{}; return !!(o.done||o.obs); };
function intakeCounts(){ const ks=MODEL.units.map(u=>u.key); return {count:ks.length, got:ks.filter(intakeGot).length}; }
function allRatingKeys(){
  if(isIntake(FORM)) return [];
  const keys=[];
  FORM.sections.forEach(sec=>sec._units.forEach(u=>keys.push(u.key)));
  return keys;
}
function updateDone(si){
  if(isIntake(FORM)){ const ks=FORM.sections[si]._units.map(u=>u.key), d=ks.filter(intakeGot).length, el=$('done-'+si);
    if(el){ el.textContent=d+'/'+ks.length+' completed or observed'; el.classList.toggle('ok', d===ks.length); } return; }
  const sec=FORM.sections[si]; const ks=sec._units.map(u=>u.key); const d=ks.filter(k=>S.ratings[k]).length;
  const vals=ks.map(k=>S.ratings[k]).filter(Boolean); const avg=vals.length? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '';
  const el=$('done-'+si); if(!el) return; el.textContent=d+'/'+ks.length+' rated'+(avg?' · avg '+avg:''); el.classList.toggle('ok', d===ks.length);
}
function scores(){
  const ks=allRatingKeys(), vals=ks.map(k=>S.ratings[k]).filter(Boolean);
  const total=vals.reduce((a,b)=>a+b,0);
  return {rated:vals.length, count:ks.length, total, max:ks.length*CONFIG.maxRating, avg: vals.length? total/vals.length : 0, needs:vals.filter(v=>v<=2).length};
}
function updateScore(){
  if(isIntake(FORM)){ const c=intakeCounts(), lvl=Object.keys(S.extra).find(k=>/level/i.test(k));
    $('score').innerHTML = '<div><span>Current level</span><br><b>'+esc((lvl&&S.extra[lvl])||'–')+'</b></div>'+
      '<div><span>Completed or observed</span><br><b>'+c.got+'</b> <span>of '+c.count+'</span></div>'+
      '<div><span>Not yet</span><br><b>'+(c.count-c.got)+'</b></div>'; return; }
  const s=scores();
  $('score').innerHTML = '<div><span>Total score</span><br><b>'+s.total+'</b> <span>of '+s.max+'</span></div>'+
    '<div><span>Average</span><br><b>'+(s.rated? s.avg.toFixed(2):'–')+'</b></div>'+
    '<div><span>Rated</span><br><b>'+s.rated+'</b> <span>of '+s.count+'</span></div>'+
    '<div><span>Needs Work (1–2)</span><br><b>'+s.needs+'</b></div>';
}

/* ---------- validation ---------- */
function setMsg(t, err){ const m=$('barmsg'); m.textContent=t||''; m.classList.toggle('err',!!err); }
function validate(){
  const problems=[]; let first=null;
  const mark=(el,msg)=>{ el.classList.add('invalid'); problems.push(msg); if(!first) first=el; };
  if(!$('trainer').value.trim()) mark($('trainer'),'trainer');
  if(!$('employee').value.trim()) mark($('employee'),'employee');
  if(!$('date').value) mark($('date'),'date');
  if(isIntake(FORM)){ const lv=document.querySelector('[data-extra][data-extra*="Level"]'); if(lv && !lv.value) mark(lv,'current employee level'); }
  const missing = allRatingKeys().filter(k=>!S.ratings[k]);
  missing.forEach(k=>{ const g=document.querySelector('[data-rate="'+CSS.escape(k)+'"]'); if(g){ g.classList.add('invalid'); if(!first) first=g; } });
  if(missing.length) problems.push(missing.length+' rating'+(missing.length>1?'s':''));
  ['sigTrainer','sigEmployee'].forEach(k=>{ if(!S[k]){ const b=$('box-'+k); b.classList.add('invalid'); problems.push(k==='sigTrainer'?'trainer signature':'employee signature'); if(!first) first=b; } });
  if(first){ first.scrollIntoView({behavior:'smooth',block:'center'}); }
  return problems;
}

const pdfText = t => String(t==null?'':t).replace(/\s*→\s*/g,' to ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/[^\x00-\xff–—•…]/g,'');

const SHORT = {'Intake Form':'Intake Form','24 or 40 Hour Hazwoper with Hands On':'HAZWOPER','Advance Blasting Classroom Training or HASC WJTA Online':'Adv. Blasting Class','Advance Blasting Hands On or WJTA Hands On Training':'Adv. Blasting Hands On','Advance Mechanics Training':'Adv. Mechanics','Basic Mechanical Troubleshooting':'Basic Mech. Troubleshoot','Basic Set Up, Troubleshooting and Equipment':'Basic Set-Up','CDL':'CDL','Defensive Driving - EnviroVac':'Defensive Driving','DiSC Profile':'DiSC','Driver Equipment Training':'Driver Equipment','Envirovac Hands On Training':'Hands On','HASC WJTA Online':'WJTA Online','Lancing Automation Training':'Lancing Automation','Level Up -Part One':'Level Up 1','Level Up-Part Two':'Level Up 2','Management and Leadership Skills for New Managers':'Mgmt & Leadership','OSHA 30hr':'OSHA 30','Operator Training':'Operator Training','Tech I to Tech II Skill Assessment':'Tech I to II','Tech II to Tech III Post Test Assessment':'Tech II to III Post Test','Tech II to Tech III Skill Assessment':'Tech II to III','WJTA Hands On Training':'WJTA Hands On'};
// Which training column an evaluation counts toward.
const INTAKE_COL = 'Intake Form';
const FORM_TO_TRAINING = {'intake':INTAKE_COL,'operator-training':'Operator Training','driver-part-1-pickup-trailer':'Driver Equipment Training','driver-part-2-vacuum-truck':'Driver Equipment Training','pump-advance-mechanical':'Advance Mechanics Training','basic-mechanical-troubleshooting':'Basic Mechanical Troubleshooting','basic-setup-troubleshooting':'Basic Set Up, Troubleshooting and Equipment','hydroblasting-tube-bundle-automation':'Lancing Automation Training','hazwoper-decontamination':'24 or 40 Hour Hazwoper with Hands On','tech-i-to-tech-ii':'Tech I to Tech II Skill Assessment','tech-ii-to-tech-iii':'Tech II to Tech III Skill Assessment'};
const nameKey = n => { n=String(n||''); if(n.includes(',')){ const [l,f]=n.split(','); n=f+' '+l; } const t=n.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(x=>x.length>1); return t.length? t[0]+' '+t[t.length-1] : ''; };
let HIST = null, SUB = new Map(), COMMENTS = new Map(); // COMMENTS: nameKey -> [{date, trainer, comment}] // SUB: nameKey -> Map(training -> {date, forms:Set})
function addSubmission(row){
  const k = nameKey(row.employee), t = FORM_TO_TRAINING[row.formId]; if(!k || !t) return;
  const m = SUB.get(k) || SUB.set(k, new Map()).get(k);
  const cur = m.get(t) || {date:'', forms:new Set()};
  cur.forms.add(row.formId); if(!cur.date || (row.date||'') > cur.date) cur.date = row.date||'';
  m.set(t, cur);
}
const isDate = v => /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(v||'');
const shortD = iso => { if(!iso) return ''; const [y,m,d]=iso.slice(0,10).split('-'); return m+'/'+d; };
function statusOf(p, t){
  if(t===INTAKE_COL){
    const sub = (SUB.get(nameKey(p.name))||new Map()).get(t);
    if(sub) return {k:'c', label: sub.date? sub.date.slice(5,7)+'/'+sub.date.slice(8,10)+'/'+sub.date.slice(2,4) : 'Done', text:'Intake form sent from this site '+fmtDate(sub.date)};
    // a completed form in SharePoint > Completed Level Up Intake Forms: its date modified
    if(p.intakeDate) return {k:'c', label: p.intakeDate.slice(5,7)+'/'+p.intakeDate.slice(8,10)+'/'+p.intakeDate.slice(2,4), text:'Intake form in Completed Level Up Intake Forms, '+fmtDate(p.intakeDate)+(p.intakeFile?' ('+p.intakeFile+')':'')};
    return p.intake ? {k:'c', label:'Done', text:'Intake form entered (Trainer Tracker)'} : {k:'i', label:'Inc', text:'No intake form yet'};
  }
  const v = (p.trainings||{})[t] || '';
  if(isDate(v)) return {k:'c', label:v, text:'Complete '+v};
  const sub = (SUB.get(nameKey(p.name))||new Map()).get(t);
  if(sub){
    let note='';
    if(t==='Driver Equipment Training'){ const n=sub.forms.size; note = n<2 ? ' (part '+(sub.forms.has('driver-part-1-pickup-trailer')?'1':'2')+' of 2)' : ' (both parts)'; }
    return {k:'s', label:'Sub '+shortD(sub.date), text:'Submitted '+fmtDate(sub.date)+note+', waiting for HSI'};
  }
  if(/delinquent/i.test(v)) return {k:'d', label:'Delinq', text:'Delinquent'};
  if(!p.inHSIReport) return {k:'u', label:'?', text:'Not in the HSI training cycle report'};
  return {k:'i', label:'Inc', text:'Incomplete'};
}
function required(p){ return [INTAKE_COL].concat(requiredHSI(p)); }
function requiredHSI(p){
  if(p.inHSIReport) return HIST.trainings.filter(t=>{ const v=(p.trainings[t]||'').toUpperCase(); return v && v!=='N/A'; });
  return (HIST.requiredByCohort[p.cohort]||[]).slice();
}
function periodLabel(p){
  if(p.period) return p.period;
  if(!p.start) return 'Period not set';
  const f = iso => iso ? new Date(iso+'T12:00').toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '';
  return f(p.start)+' - '+f(p.end);
}
function summarize(p){
  const req = required(p), sts = req.map(t=>[t,statusOf(p,t)]);
  const done = sts.filter(x=>x[1].k==='c').length, sub = sts.filter(x=>x[1].k==='s').length;
  return {req, sts, done, sub, total:req.length, pct: req.length? done/req.length : 0};
}

function msWire(id,set,allText,many,onChange){
  const root=$(id), btn=$(id+'-b'), pop=root.querySelector('.mspop'), q=pop.querySelector('input[type=search]');
  const boxes=[...pop.querySelectorAll('.mslist input')];
  const sync=()=>{ boxes.forEach(b=>b.checked=set.has(b.value)); const n=set.size; btn.textContent = !n? allText : n===1? [...set][0] : n+' '+many; btn.classList.toggle('on',n>0); };
  const close=()=>{ pop.hidden=true; btn.setAttribute('aria-expanded','false'); };
  btn.addEventListener('click',()=>{ const open=pop.hidden; document.querySelectorAll('.mspop').forEach(x=>x.hidden=true); pop.hidden=!open; btn.setAttribute('aria-expanded',String(open)); if(open){ pop.style.left=''; pop.style.right=''; const r=pop.getBoundingClientRect(); if(r.right>innerWidth-8){ pop.style.left='auto'; pop.style.right='0'; } q.value=''; filt(); q.focus(); } });
  const filt=()=>{ const t=q.value.trim().toLowerCase(); pop.querySelectorAll('.mslist label').forEach(l=>l.hidden = !!t && !l.dataset.t.includes(t)); };
  q.addEventListener('input',filt);
  pop.addEventListener('change',e=>{ const b=e.target; if(!b.matches('.mslist input')) return; b.checked? set.add(b.value) : set.delete(b.value); sync(); onChange(); });
  pop.addEventListener('click',e=>{ const a=e.target.closest('[data-ms]'); if(!a) return;
    if(a.dataset.ms==='none') set.clear(); else boxes.forEach(b=>{ if(!b.closest('label').hidden) set.add(b.value); });
    sync(); onChange(); });
  root.addEventListener('keydown',e=>{ if(e.key==='Escape'){ close(); btn.focus(); } });
  document.addEventListener('click',e=>{ if(!root.contains(e.target)) close(); });
  sync();
  return sync;
}

function drawCohortTable(mode){

  const pickT = st.trainings.size ? st.trainings : null;
  let rows = cohortPeople(mode).map(p=>{ const r=Object.assign({p},summarize(p));
    if(pickT){ r.sts=r.sts.filter(x=>pickT.has(x[0])); r.req=r.req.filter(t=>pickT.has(t));
      r.done=r.sts.filter(x=>x[1].k==='c').length; r.sub=r.sts.filter(x=>x[1].k==='s').length; r.total=r.req.length; r.pct=r.total? r.done/r.total : 0; }
    return r; }).filter(r=>{
    const p=r.p;
    if(pickT && !r.total) return false;
    if(q.length && !q.every(t=>(p.name+' '+p.id).toLowerCase().includes(t))) return false;
    if(st.ees.size && !st.ees.has(p.name)) return false;
    if(st.offices.size && !st.offices.has(p.office)) return false;
    if(st.cohort && p.cohort!==st.cohort) return false;
    if(st.period && periodLabel(p)!==st.period) return false;
    if(st.show==='missing' && !(r.done<r.total)) return false;
    if(st.show==='complete' && !(r.total && r.done===r.total)) return false;
    if(st.show==='submitted' && !r.sub) return false;
    if(st.show==='nr' && !p.notRecommended) return false;
    if(st.show==='comments' && !commentsOf(p).length) return false;
    if(st.stat.size && !r.sts.some(x=>st.stat.has(statGroup(x[1].k)))) return false;
    return true;
  });
  const desc = st.sort.startsWith('-'), key = st.sort.replace('-','');
  const val = r => key==='progress'? r.pct : key==='office'? r.p.office : key==='cohort'? r.p.cohort+' '+r.p.start : r.p.name.toLowerCase();
  rows.sort((a,b)=>{ const x=val(a), y=val(b); const c = typeof x==='number'? x-y : String(x).localeCompare(String(y)); return (desc?-c:c) || a.p.name.localeCompare(b.p.name); });
  const cols = HIST.trainings.filter(t=>rows.some(r=>r.req.includes(t)));
  const arr = k => st.sort===k?' ↑':st.sort==='-'+k?' ↓':'';
  el.querySelector('thead').innerHTML = '<tr><th class="sticky"><button data-sort="name">Employee'+arr('name')+'</button></th><th><button data-sort="cohort">Training Cycle'+arr('cohort')+'</button></th><th><button data-sort="progress">Complete'+arr('progress')+'</button></th>'+
    cols.map(t=>'<th class="tc" title="'+esc(t)+'">'+esc(SHORT[t]||t)+'</th>').join('')+'</tr>';
  const body = rows.map(r=>{
    const p=r.p, k=p.id||p.name, open=st.open.has(k);
    const tags = (p.notRecommended?'<span class="tag2 nr">Not recommended</span>':'')+(!p.employed?'<span class="tag2">No longer employed</span>':'')+(p.employed && !p.inHSIReport?'<span class="tag2">Not in HSI report</span>':'')+(commentsOf(p).length?'<span class="tag2">'+commentsOf(p).length+' comment'+(commentsOf(p).length===1?'':'s')+'</span>':'');
    let h = '<tr class="'+(p.notRecommended?'nr ':'')+(!p.employed?'gone':'')+'"><td class="sticky"><button type="button" class="who2" data-open="'+esc(k)+'" aria-expanded="'+open+'">'+esc(p.name)+'</button><span class="meta">'+esc([p.office,p.jobTitle].filter(Boolean).join(' · '))+'</span>'+tags+'</td>'+
      '<td>'+esc(p.cohort||'—')+'<span class="meta">'+esc(periodLabel(p))+'</span></td>'+
      '<td><div class="prog"><span class="b"><i style="width:'+Math.round(r.pct*100)+'%"></i></span><b>'+r.done+'/'+r.total+'</b></div>'+(r.sub?'<span class="meta">'+r.sub+' submitted</span>':'')+'</td>'+
      cols.map(t=>{ if(!r.req.includes(t)) return '<td><span class="st n">·</span></td>'; const s=statusOf(p,t), dim = st.stat.size && !st.stat.has(statGroup(s.k)); return '<td'+(dim?' style="opacity:.3"':'')+'><span class="st '+s.k+'" title="'+esc((SHORT[t]||t)+': '+s.text)+'">'+esc(s.k==='c'? s.label.replace(/\/\d{2,4}$/,'') : s.label)+'</span></td>'; }).join('')+'</tr>';
    if(open){
      const done=r.sts.filter(x=>x[1].k==='c'), sub=r.sts.filter(x=>x[1].k==='s'), miss=r.sts.filter(x=>!['c','s'].includes(x[1].k));
      const li = a => a.length? '<ul>'+a.map(([t,s])=>'<li>'+esc(t)+' <span class="meta" style="display:inline">'+esc(s.text)+'</span></li>').join('')+'</ul>' : '<div class="meta">None</div>';
      h += '<tr class="det"><td colspan="'+(3+cols.length)+'"><div class="detail"><div><h5>Completed ('+done.length+')</h5>'+li(done)+'</div><div><h5>Submitted ('+sub.length+')</h5>'+li(sub)+'</div><div><h5>Missing ('+miss.length+')</h5>'+li(miss)+'</div>'+needsHTML(p)+commentsHTML(p)+'</div></td></tr>';
    }
    return h;
  }).join('');
  st.last = {rows, cols};
  el.querySelector('tbody').innerHTML = body || '<tr><td colspan="'+(3+cols.length)+'"><div class="empty">No one matches these filters.</div></td></tr>';
  $(mode+'-count').textContent = rows.length+' '+(rows.length===1?'person':'people')+' · '+rows.filter(r=>r.total&&r.done===r.total).length+' all complete · '+rows.filter(r=>r.done<r.total).length+' missing items';
}

async function loadLog(){
  if(!CONFIG.logUrl) return;

    const r = await fetch(CONFIG.logUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!r.ok) return;
    let rows = await r.json(); rows = Array.isArray(rows)? rows : (rows.value||rows.rows||[]);
    // Excel can hand dates back as serial numbers (46309 = 2026-10-14).
    const toISO = v => { v=String(v||'').trim(); if(/^\d{4,6}(\.\d+)?$/.test(v)){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(+v)*86400000); return d.toISOString().slice(0,10); } return v.slice(0,10); };
    rows.forEach(x=>addSubmission({employee:x['Employee']||x.employee, formId:x['Form ID']||x.formId, date:toISO(x['Evaluation Date']||x.evaluationDate||x['Submitted At'])}));
    rows.forEach(x=>addEvalNeeds(x, toISO));

/* ---------- needs identified in evaluations (from the Evaluation Log) ---------- */
const EVALNEEDS = new Map(); // nameKey -> [{date, form, trainer, needs:[[section,[items]]]}]
function logNeedsText(x){
  // the column holding "Section: item (2); Section: item (1)" - named Needs List / Needs / needsList in the log
  const keys = Object.keys(x);
  const k = keys.find(c=>/need/i.test(c) && /list/i.test(c)) || keys.find(c=>/need/i.test(c) && isNaN(+x[c]) && /:/.test(String(x[c])));
  return k ? String(x[k]||'').trim() : '';
}
function addEvalNeeds(x, toISO){
  const formId = x['Form ID']||x.formId||'';
  if(formId==='intake') return;   // the intake form lists trainings not done yet, not needs
  const txt = logNeedsText(x); if(!txt || /^none$/i.test(txt)) return;
  const k = nameKey(x['Employee']||x.employee); if(!k) return;
  const groups = [];
  txt.split(/;\s*/).map(t=>t.trim()).filter(Boolean).forEach(t=>{
    const i=t.indexOf(': '), sec = i>0? t.slice(0,i) : '', item = i>0? t.slice(i+2) : t;
    let g = groups.find(g=>g[0]===sec); if(!g){ g=[sec,[]]; groups.push(g); } g[1].push(item);
  });
  const f = FORMS.find(f=>f.id===formId);
  const form = x['Evaluation']||x.formTitle||(f? f.title+(f.subtitle?' – '+f.subtitle:'') : formId);
  (EVALNEEDS.get(k)||EVALNEEDS.set(k,[]).get(k)).push({date:toISO(x['Evaluation Date']||x.evaluationDate||x['Submitted At']), form, trainer:x['Trainer']||x.trainer||'', needs:groups});
  EVALNEEDS.get(k).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function needsHTML(p){
  const list = EVALNEEDS.get(nameKey(p.name))||[];
  let h = '<div class="evneeds"><h5>Needs identified in evaluations ('+list.reduce((n,e)=>n+e.needs.reduce((m,g)=>m+g[1].length,0),0)+')</h5>';
  if(!list.length) return h+'<div class="meta">None recorded.</div></div>';
  return h + list.map(e=>'<div class="ev"><b>'+esc(e.form)+'</b> <span class="meta" style="display:inline">'+esc(fmtDate(e.date)||e.date)+(e.trainer?' · '+esc(e.trainer):'')+'</span>'+
    e.needs.map(([sec,items])=>(sec?'<div class="nsec">'+esc(sec)+'</div>':'')+'<ul>'+items.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>').join('')+'</div>').join('')+'</div>';
}

  $('cmt-pick').addEventListener('change', e=>cmtPick(e.target.value));
  $('cmt-pick').addEventListener('search', e=>{ if(!e.target.value){ CMT_SEL=null; renderCommentsTab(); } });
  $('cmt-pick').addEventListener('input', e=>{ const k=nameKey(e.target.value); if(k && cmtPeople().some(p=>nameKey(p.name)===k && p.name===e.target.value)) cmtPick(e.target.value); });
  $('p-cmt').addEventListener('click', e=>{
    const a=e.target.closest('[data-addc]'); if(a){ saveComment('cmt', a); return; }
    const r=e.target.closest('[data-cpick]'); if(r){ cmtPick(r.dataset.cpick); window.scrollTo({top:0,behavior:'smooth'}); }
  });
  renderFormList();
  $('cohortpick').addEventListener('click', e=>{ const b=e.target.closest('.cpick'); if(b) pickCohort(b.dataset.cohort); });
  typeahead($('trainer'), ()=>(CONFIG.trainers||[]).map(t=>({label:t})), null);
  typeahead($('employee'), ()=>ROSTER.map(r=>({label:r.name, sub:[r.office,r.id].filter(Boolean).join(' · '), r})), o=>{ if(o.r && o.r.office) $('office').value=o.r.office;
    // jump to the employee's current cohort
    const k=nameKey(o.label), p=HIST && HIST.people.find(x=>nameKey(x.name)===k && x.employed && (!x.end || x.end>=todayISO()));
    if(p && COHORT_FORMS.some(c=>c[0]===p.cohort) && $('evaluation').hidden && PICKED_COHORT!=='Intake (all levels)') pickCohort(p.cohort); });
  const t = lsGet(LS_TRAINER); if(t) $('trainer').value=t;
  $('date').value = todayISO();
  const d = JSON.parse(lsGet(LS_DRAFT)||'null');
  if(d && d.formId && FORMS.some(f=>f.id===d.formId)){
    const f = FORMS.find(x=>x.id===d.formId);
    const r=$('result'); r.hidden=false; r.className='notice';
    r.innerHTML='You have an unsent <b>'+esc(f.title)+'</b>'+(d.employee?' for '+esc(d.employee):'')+'. <button type="button" class="linkbtn" id="b-resume">Continue it</button> <button type="button" class="linkbtn" id="b-discard">Discard it</button>';
    $('b-resume').addEventListener('click', ()=>{ r.hidden=true; openForm(d.formId, d); });
    $('b-discard').addEventListener('click', ()=>{ lsSet(LS_DRAFT,null); r.hidden=true; });
  }
})();
})();
</script>
</body>
</html>
